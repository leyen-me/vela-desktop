services:
  web:
    build: .
    image: vela-desktop-web
    ports:
      - "${API_PORT:-5174}:5174"
    restart: unless-stopped
    environment:
      API_PORT: 5174
      HOST: 0.0.0.0
      LONGPORT_APP_KEY: ${LONGPORT_APP_KEY:-}
      LONGPORT_APP_SECRET: ${LONGPORT_APP_SECRET:-}
      LONGPORT_ACCESS_TOKEN: ${LONGPORT_ACCESS_TOKEN:-}
      LONGPORT_HTTP_URL: ${LONGPORT_HTTP_URL:-https://openapi.longportapp.com}
      LONGPORT_QUOTE_WS_URL: ${LONGPORT_QUOTE_WS_URL:-wss://openapi-quote.longportapp.com/v2}
      LONGPORT_TRADE_WS_URL: ${LONGPORT_TRADE_WS_URL:-wss://openapi-trade.longportapp.com/v2}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DSH_ENABLED: ${DSH_ENABLED:-true}
      DSH_PROVIDER: ${DSH_PROVIDER:-deepseek-official}
      DSH_MODEL: ${DSH_MODEL:-deepseek-v4-flash}
      DSH_REASONING_EFFORT: ${DSH_REASONING_EFFORT:-low}
    volumes:
      - vela-cache:/app/data/cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5174/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  vela-cache:
